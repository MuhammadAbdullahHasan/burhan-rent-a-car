name: burhan_rent_a_car
description: Offline-first rental management for Burhan Rent-A-Car.
publish_to: 'none'
version: 0.4.0+6

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The validated data layer, used as-is -- schema, repositories, import
  # pipeline, rental numbering and search all live there and are covered by
  # its own test suite.
  burhan_rent_a_car_data:
    path: ../

  sqflite: ^2.4.0
  path: ^1.9.0
  sqflite_common_ffi_web: ^0.4.5+4
  supabase_flutter: ^2.15.4
  image_picker: ^1.2.0
  image: ^4.10.1
  share_plus: ^12.0.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^10.3.4
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Lets widget tests open a real database without a device.
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # DEVELOPMENT ONLY: seeds the local database on first launch so there is
    # realistic data to work against before the real CSV exists.
    - assets/burhan_rent_a_car_temporary_test.csv

# Launcher icon, generated from the business logo with
# `dart run flutter_launcher_icons`. Sources live in assets/icon/.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#000000"
    theme_color: "#12496B"
